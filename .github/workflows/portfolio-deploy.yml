name: Portfolio

on:
    push:
        branches: [main]

    workflow_dispatch:

permissions:
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deloyment.outputs.page.url}}
            

        steps:
            # gst access to your portfolio code via pre-buid actions
            # STEP 1
            - name: chechout code
              uses: actions/chechout@v4
            # steup github pages
            # STEP 2
            - name: setup github pages
              uses: actions/configure-github-pages@v4

            # static code artifacts
            # STEP 3
            - name: upload static files
              uses: actions/upload-pages-artifacts@v4
              with:
                path: "."
            # deploy
            #  STEP 4
            - name: Deploy to github pages
              uses: actions/deploy-pages@v4
               
